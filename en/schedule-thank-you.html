<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Appointment confirmed — Mejor Vida Insurance</title>
<meta content="noindex, follow" name="robots"/>
<link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
<link href="../css/fontawesome-mvi.min.css?v=20260723-brands-fix" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  body { font-family: Inter, system-ui, sans-serif; background: #cfe6f7; color: #1f2937; min-height: 100vh; margin: 0; }
  .sch-thanks-wrap { max-width: 36rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
  .sch-thanks-card {
    background: #fff;
    border-radius: 0.75rem;
    border: 1px solid #e2e8f0;
    box-shadow: 0 8px 28px rgba(13, 71, 161, 0.1);
    padding: 1.75rem 1.5rem;
    text-align: center;
  }
  .sch-thanks-card h1 { color: #0d47a1; font-size: 1.45rem; margin: 0 0 0.75rem; }
  .sch-thanks-when {
    background: #f0fdf4;
    border: 1px solid #86efac;
    border-radius: 0.5rem;
    padding: 0.85rem 1rem;
    margin: 1rem 0 1.25rem;
    font-weight: 600;
    color: #166534;
  }
  .sch-thanks-card p { margin: 0 0 1rem; line-height: 1.5; color: #334155; }
  .sch-thanks-card a.btn-home { font-weight: 600; color: #0d47a1; text-decoration: underline; }
</style>
</head>
<body>
<main class="sch-thanks-wrap">
  <div class="sch-thanks-card" role="main">
    <h1>Your appointment is confirmed!</h1>
    <p>We sent you an email with the details. Julie will call the number you provided at the scheduled time.</p>
    <div class="sch-thanks-when" id="sch-thanks-when" hidden></div>
    <p class="small text-muted">To reschedule, reply to the confirmation email or call <a href="tel:+14024405438">402-440-5438</a>.</p>
    <p><a class="btn-home" href="index.html">Return to home</a></p>
  </div>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var when = params.get("when") || "";
  var el = document.getElementById("sch-thanks-when");
  if (when && el) {
    el.textContent = when;
    el.hidden = false;
  }
  if (typeof gtag === "function") {
    gtag("event", "appointment_booked_thank_you", { location: "mvi_scheduler" });
  }
})();
</script>
</body>
