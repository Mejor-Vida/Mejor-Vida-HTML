<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Mejor Vida — CRM</title>
  <link rel="stylesheet" href="/css/staff-crm.css?v=20260712h" />
  <link rel="stylesheet" href="/css/medical-intake.css?v=20260603h" />
  <link rel="stylesheet" href="/css/staff-crm-medical.css?v=20260529a" />
  <link rel="stylesheet" href="/css/staff-crm-connect.css?v=20260612a" />
  <link rel="stylesheet" href="/css/staff-crm-pipeline.css?v=20260707a" />
  <link rel="stylesheet" href="/css/staff-crm-overview.css?v=20260531f" />
  <link rel="stylesheet" href="/css/staff-crm-add-client.css?v=20260531h" />
  <link rel="stylesheet" href="/css/staff-crm-oos.css?v=20260609a" />
  <link rel="stylesheet" href="/css/staff-crm-licensing.css?v=20260709e" />
  <link rel="stylesheet" href="/css/staff-crm-assistant.css?v=20260609a" />
  <link rel="stylesheet" href="/css/staff-crm-knowledge.css?v=20260609a" />
  <link rel="stylesheet" href="/css/staff-crm-todo.css?v=20260610a" />
  <link rel="stylesheet" href="/css/staff-crm-funnel-dashboard.css?v=20260712c" />
  <link rel="stylesheet" href="/css/staff-crm-mobile.css?v=20260610b" />
</head>
<body class="crm-body">
  <main id="crm-login" class="crm-login-wrap">
    <section class="crm-login-card">
      <a href="/" class="crm-login-logo-link">
        <picture>
<source type="image/webp" srcset="/img/opt/logo-english2.webp"/>
<img id="crm-login-logo" class="crm-login-logo" alt="Mejor Vida Insurance" src="/img/opt/logo-english2.png" width="800" height="533" loading="lazy" decoding="async"/>
</picture>
      </a>
      <p class="sub" data-i18n="login_sub">Staff CRM — Internal Use Only</p>
      <div class="crm-lang-toggle crm-lang-toggle-login" role="group" aria-label="Language">
        <button type="button" class="lang-opt active" data-lang="en" id="crm-login-lang-en">English</button>
        <button type="button" class="lang-opt" data-lang="es" id="crm-login-lang-es">Español</button>
      </div>
      <form id="crm-login-form">
        <label for="crm-login-email" data-i18n="login_email">Email</label>
        <input id="crm-login-email" type="email" autocomplete="username" required />
        <label for="crm-login-pass" data-i18n="login_pass">Password</label>
        <input id="crm-login-pass" type="password" autocomplete="current-password" required />
        <div style="margin-top:16px">
          <button id="crm-login-btn" class="crm-btn" type="submit" data-i18n="login_btn">Sign In</button>
        </div>
        <div id="crm-login-err" class="crm-err"></div>
      </form>
      <p style="margin-top:16px;font-size:0.88rem;color:var(--crm-muted)">
        <a href="/staff/index.html" data-i18n="login_classic">Classic staff portal</a>
      </p>
    </section>
  </main>

  <div id="crm-app" class="crm-app hidden" aria-hidden="true">
    <header class="crm-header">
      <button type="button" id="crm-nav-toggle" class="crm-nav-toggle" aria-expanded="false" aria-controls="crm-sidebar">
        <span class="crm-nav-toggle-icon" aria-hidden="true"></span>
        <span class="visually-hidden" data-i18n="nav_menu">Menu</span>
      </button>
      <a href="#/dashboard" class="crm-header-brand" id="crm-header-home">
        <picture>
<source type="image/webp" srcset="/img/opt/logo-english2.webp"/>
<img id="crm-header-logo" class="crm-header-logo" alt="Mejor Vida Insurance" src="/img/opt/logo-english2.png" width="800" height="533" fetchpriority="high" decoding="async"/>
</picture>
      </a>
      <div class="crm-header-actions">
        <div class="crm-lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-opt active" data-lang="en" id="crm-lang-en">English</button>
          <button type="button" class="lang-opt" data-lang="es" id="crm-lang-es">Español</button>
        </div>
        <a href="/staff/index.html" class="crm-classic-link" data-i18n="classic_portal">Classic portal</a>
        <button type="button" id="crm-signout" class="crm-btn secondary" style="padding:8px 14px;font-size:0.85rem" data-i18n="sign_out">Sign Out</button>
      </div>
    </header>

    <div class="crm-shell">
      <div id="crm-sidebar-backdrop" class="crm-sidebar-backdrop" aria-hidden="true"></div>
      <aside id="crm-sidebar" class="crm-sidebar" aria-label="Main navigation">
        <button type="button" class="crm-nav-item" data-nav="dashboard">
          <span class="crm-nav-icon" aria-hidden="true">▦</span>
          <span data-i18n="nav_dashboard">Dashboard</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="ga4">
          <span class="crm-nav-icon" aria-hidden="true">📊</span>
          <span data-i18n="nav_ga4">GA4 Analytics</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="clients">
          <span class="crm-nav-icon" aria-hidden="true">👤</span>
          <span data-i18n="nav_clients">Clients</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="inbox">
          <span class="crm-nav-icon" aria-hidden="true">✉</span>
          <span data-i18n="nav_inbox">Inbox</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="assistant">
          <span class="crm-nav-icon" aria-hidden="true">🤖</span>
          <span data-i18n="nav_assistant">Staff Assistant</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="oos">
          <span class="crm-nav-icon" aria-hidden="true">↗</span>
          <span data-i18n="nav_oos">OOS</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="licensing">
          <span class="crm-nav-icon" aria-hidden="true">🪪</span>
          <span data-i18n="nav_licensing">Licensing</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="knowledge">
          <span class="crm-nav-icon" aria-hidden="true">📚</span>
          <span data-i18n="nav_knowledge">Knowledge</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="nurture-settings">
          <span class="crm-nav-icon" aria-hidden="true">⚙</span>
          <span data-i18n="nav_nurture_settings">Nurture</span>
        </button>
        <button type="button" class="crm-nav-item" data-nav="todo">
          <span class="crm-nav-icon" aria-hidden="true">✓</span>
          <span data-i18n="nav_todo">To-Do</span>
        </button>
        <div class="crm-sidebar-foot">
          <span data-i18n="nav_foot">CRM shell v1 · Clients + Connect + Pipeline + OOS</span>
          <span class="crm-build-stamp">20260609a</span>
        </div>
      </aside>

      <main id="crm-main" class="crm-main" aria-live="polite"></main>
    </div>

    <nav class="crm-bottom-nav" aria-label="Quick navigation" id="crm-bottom-nav">
      <button type="button" class="crm-bottom-nav-btn" data-nav="dashboard">
        <span class="crm-bottom-nav-icon" aria-hidden="true">▦</span>
        <span data-i18n="nav_dashboard">Dashboard</span>
      </button>
      <button type="button" class="crm-bottom-nav-btn" data-nav="clients">
        <span class="crm-bottom-nav-icon" aria-hidden="true">👤</span>
        <span data-i18n="nav_clients">Clients</span>
      </button>
      <button type="button" class="crm-bottom-nav-btn" data-nav="assistant">
        <span class="crm-bottom-nav-icon" aria-hidden="true">🤖</span>
        <span data-i18n="nav_assistant_short">Assistant</span>
      </button>
      <button type="button" class="crm-bottom-nav-btn" data-nav="todo">
        <span class="crm-bottom-nav-icon" aria-hidden="true">✓</span>
        <span data-i18n="nav_todo">To-Do</span>
      </button>
      <button type="button" class="crm-bottom-nav-btn" id="crm-bottom-nav-more" data-nav="more">
        <span class="crm-bottom-nav-icon" aria-hidden="true">☰</span>
        <span data-i18n="nav_more">More</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/staff-crm-i18n.js?v=20260712h"></script>
  <script src="/js/staff-crm-stages.js?v=20260606d"></script>
  <script src="/js/staff-crm-medical.js?v=20260529a"></script>
  <script src="/js/staff-crm-connect.js?v=20260612a"></script>
  <script src="/js/staff-crm-pipeline.js?v=20260707e"></script>
  <script src="/js/staff-crm-comm-notes.js?v=20260612a"></script>
  <script src="/js/staff-crm-compliance.js?v=20260712h"></script>
  <script src="/js/us-states.js"></script>
  <script src="/js/staff-crm-add-client.js?v=20260531h"></script>
  <script src="/js/staff-crm-overview.js?v=20260605a"></script>
  <script src="/js/staff-crm-oos.js?v=20260609a"></script>
  <script src="/js/staff-crm-licensing.js?v=20260709e"></script>
  <script src="/js/staff-crm-assistant.js?v=20260609a"></script>
  <script src="/js/staff-crm-knowledge.js?v=20260609a"></script>
  <script src="/js/staff-crm-todo.js?v=20260610a"></script>
  <script src="/js/staff-crm-funnel-dashboard.js?v=20260712c"></script>
  <script src="/js/staff-crm-nurture-settings.js?v=20260712d"></script>
  <script src="/js/staff-crm.js?v=20260712g"></script>
</body>
</html>
