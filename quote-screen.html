<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta name="robots" content="noindex, follow" />
  <script>
  (function () {
    var dest = "/quote.html" + (location.search || "") + (location.hash || "");
    if (location.hostname === "mejorvidainsurance.com") {
      location.replace("https://www.mejorvidainsurance.com" + dest);
    } else {
      location.replace(dest);
    }
  })();
  </script>
  <meta http-equiv="refresh" content="0;url=/quote.html" />
</head>
<body>
  <p><a href="/quote.html">Continue to quote</a></p>
</body>
</html>
